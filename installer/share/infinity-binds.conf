# >>> infinity-hyprland: добавлено установщиком. Можно менять и удалять.
bind = SUPER SHIFT, SPACE, layoutmsg, infinity toggle
bind = ALT, Tab, layoutmsg, alttab
bind = ALT SHIFT, Tab, layoutmsg, alttab prev
binde = SUPER CTRL, left, layoutmsg, infinity pan 150 0
binde = SUPER CTRL, right, layoutmsg, infinity pan -150 0
binde = SUPER CTRL, up, layoutmsg, infinity pan 0 150
binde = SUPER CTRL, down, layoutmsg, infinity pan 0 -150
binde = SUPER CTRL, equal, layoutmsg, infinity zoom 1.25
binde = SUPER CTRL, minus, layoutmsg, infinity zoom 0.8
